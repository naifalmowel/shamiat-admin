<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shamiat Smart Admin Dashboard">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="apple-touch-icon" href="bg.webp">
  <link rel="icon" type="image/png" href="bg.webp"/>

  <title>Shamiat Admin | شاميات</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #1B4332 !important;
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background-color: #1B4332;
      position: fixed;
      top: 0; left: 0;
      z-index: 99999;
      transition: opacity 0.6s ease-in-out;
    }
    .logo {
      width: 140px;
      height: 154px;
      margin-bottom: 25px;
      animation: pulse 2s infinite ease-in-out;
    }
    .loading-text {
      color: #FFFFFF;
      font-family: 'Cairo', sans-serif;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-align: center;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: #BC8A5F;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <div id="loading-screen" class="loading-container">
    <img src="bg.webp" alt="Logo" class="logo" width="140" height="154">
    <div class="loading-text">SHAMIAT DASHBOARD</div>
    <div class="loader"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Official way to detect Flutter rendering without interfering with engine logic
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 600);
      }
    });

    // Safety fallback: ensure splash is removed even if event fails
    setTimeout(() => {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 600);
      }
    }, 10000);
  </script>
</body>
</html>
